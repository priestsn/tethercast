# ============================================================
#  mpv.conf per tethercast
#
#  Va in  /data/data/is.xyz.mpv/files/mpv.conf
#  (cartella INTERNA: quella esterna /sdcard/Android/data/... non
#   viene letta da mpv-android).
#
#  Dopo aver scritto il file servono TRE cose, altrimenti l'app lo
#  ignora pur essendo presente, leggibile e del proprietario giusto:
#     chown 10237:10237            proprietario = uid dell'app
#     chmod 600
#     restorecon                   etichetta SELinux con le categorie MCS
#  Senza restorecon l'etichetta resta u:object_r:app_data_file:s0 e
#  l'app viene bloccata pur essendo la proprietaria del file.
#
#  COME VERIFICARE CHE SIA LETTA: mettere `speed=0.25` e vedere se la
#  riproduzione rallenta di quattro volte. NON usare `vf=...` come prova:
#  un --vf= sulla riga di comando lo sostituisce e sembra che la
#  configurazione sia ignorata quando invece funziona benissimo.
#
#  MISURATO (confronto fra i due schermi, col controllo che l'immagine
#  sia VIVA — vedi l'avvertenza su untimed piu' sotto):
#     mpv coi valori predefiniti ............ 1,62 s
#     con questa configurazione ............. 0,21-0,32 s
# ============================================================

# --- latenza ---
# mpv, su un flusso di rete, riempie una coda di un paio di secondi.
# Qui il flusso arriva da mezzo metro di cavo: quella coda e' solo
# ritardo. Ma NON esagerare: una coda troppo corta affama il
# decodificatore e l'immagine si congela.
cache=no
cache-pause=no
demuxer-readahead-secs=1.0
demuxer-max-bytes=8MiB
demuxer-max-back-bytes=0

# ⚠️ DUE OPZIONI CHE SEMBRANO VELOCI E INVECE CONGELANO L'IMMAGINE.
# Provate e misurate, non fidatevi dell'intuizione:
#
#   video-sync=desync   -> tre schermate identiche al pixel mentre il
#                          flusso continuava ad arrivare
#   untimed=yes         -> e' documentata come opzione da BENCHMARK, non
#                          da visione dal vivo. Con questa lo schermo si
#                          ferma su un fotogramma fisso. Avevo perfino
#                          misurato "0,07 s" con untimed: era il
#                          confronto fra una scheda che avanzava e un
#                          tablet bloccato. Numero senza senso.
#
# Lo schermo di un monitor deve essere VIVO prima che veloce.
video-sync=audio
interpolation=no

# niente audio: qui passa solo video e sincronizzarlo aggiungerebbe coda
ao=null

# --- schermo pieno, senza interfaccia: deve sembrare un monitor ---
fullscreen=yes
keep-open=yes
osc=no
osd-level=0
osd-bar=no
border=no
cursor-autohide=always
input-default-bindings=no
input-vo-keyboard=no
force-window=yes

# --- decodifica hardware ---
# Nota: la decodifica in SOFTWARE misura quasi uguale, e vo=mediacodec_embed
# e' addirittura peggiore (0,36 s contro 0,21). Restare sul percorso normale.
hwdec=auto-safe
vd-lavc-dr=yes
keepaspect=yes
panscan=0

# --- robustezza: se il flusso cade, riprova da solo ---
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=2
network-timeout=10
