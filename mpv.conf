# ============================================================
#  mpv.conf per tethercast  —  versione DEFINITIVA
#
#  Va in  /data/data/is.xyz.mpv/files/mpv.conf
#  (cartella INTERNA: quella esterna /sdcard/Android/data/... non
#   viene letta da mpv-android).
#
#  Dopo aver scritto il file servono TRE cose, altrimenti l'app lo
#  ignora pur essendo presente e leggibile:
#     chown 10237:10237            proprietario = uid dell'app
#     chmod 600
#     restorecon                   etichetta SELinux con le categorie MCS
#  Senza restorecon l'etichetta resta u:object_r:app_data_file:s0 e
#  l'app viene bloccata pur essendo la proprietaria del file.
#  Come verificare che sia letta davvero: mettere `speed=0.25` e
#  vedere se la riproduzione rallenta di quattro volte. NON usare
#  `vf=...` come prova: un --vf= sulla riga di comando lo sostituisce
#  e sembra che la configurazione sia ignorata quando invece funziona.
#
#  MISURATO (ritardo fino al tablet, metodo del colore, rumore 0,04 s):
#     mpv coi valori predefiniti ............ 1,62 s
#     questa configurazione ................. 0,62 s
# ============================================================

# --- latenza ---
# mpv, su un flusso di rete, riempie una coda di un paio di secondi.
# Qui il flusso arriva da un cavo a mezzo metro: quella coda e' solo
# ritardo. Ma NON esagerare: una coda troppo corta affama il
# decodificatore e l'immagine si congela (verificato).
cache=no
cache-pause=no
demuxer-readahead-secs=1.0
demuxer-max-bytes=8MiB
demuxer-max-back-bytes=0

# ⚠️ video-sync=desync CONGELA l'immagine su questo flusso (verificato:
# tre schermate identiche al pixel mentre il flusso continuava ad
# arrivare). Usare audio: senza traccia audio e' comunque il clock
# piu' stabile.
video-sync=audio
interpolation=no

# niente audio: qui passa solo video e sincronizzarlo aggiungerebbe coda
ao=null

# --- schermo pieno, senza interfaccia: deve sembrare un monitor ---
fullscreen=yes
keep-open=yes
osc=no
osd-level=0
osd-bar=no
border=no
cursor-autohide=always
input-default-bindings=no
input-vo-keyboard=no
force-window=yes

# --- decodifica hardware ---
hwdec=auto-safe
vd-lavc-dr=yes
keepaspect=yes
panscan=0

# --- robustezza: se il flusso cade, riprova da solo ---
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=2
network-timeout=10
